<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Readymade PPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <div class="bg-white rounded-xl shadow-lg p-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">📊 Admin Dashboard</h1>
            <a href="index.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Go to App</a>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <h2 class="text-base font-bold text-gray-700 mb-3">📷 Payment QR Code URL</h2>
                <input type="text" id="qrInput" value="/qr.jpg" placeholder="/qr.jpg" class="w-full p-2 border rounded mb-3 text-sm">
            </div>
            <div>
                <h2 class="text-base font-bold text-gray-700 mb-3">📢 Promotion Banner URL</h2>
                <input type="text" id="promoInput" placeholder="Enter Promotion Image URL" class="w-full p-2 border rounded mb-3 text-sm">
            </div>
            <div>
                <h2 class="text-base font-bold text-gray-700 mb-3">💳 Subscription Plans</h2>
                <div id="plansContainer" class="space-y-1 text-xs text-gray-600 mb-3"></div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-4 text-right">
            <button onclick="updateSettings()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700">Save All Changes</button>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-lg font-bold text-gray-700 mb-4">👥 Registered Users List</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-sm">
                            <th class="p-3">Name</th>
                            <th class="p-3">Mobile</th>
                            <th class="p-3">District / State</th>
                            <th class="p-3">Plan</th>
                            <th class="p-3">Expiry Date</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="text-sm text-gray-600"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function loadData() {
            const settingsRes = await fetch('/api/settings');
            const settingsData = await settingsRes.json();
            if(settingsData.success) {
                document.getElementById('qrInput').value = settingsData.setting.qrCodeUrl || '/qr.jpg';
                document.getElementById('promoInput').value = settingsData.setting.promoBannerUrl || '';
                
                let pContainer = document.getElementById('plansContainer');
                pContainer.innerHTML = '';
                settingsData.setting.plans.forEach(p => {
                    pContainer.innerHTML += `<div class="p-1 bg-gray-50 border rounded flex justify-between"><span><b>${p.name}</b> (${p.price})</span><span>${p.days} Days</span></div>`;
                });
            }

            const userRes = await fetch('/api/admin/users');
            const userData = await userRes.json();
            if (userData.success) {
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';
                userData.users.forEach(user => {
                    let row = `<tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-semibold text-gray-800">${user.name || 'N/A'}</td>
                        <td class="p-3">${user.mobile}</td>
                        <td class="p-3">${user.district || ''}, ${user.state || ''}</td>
                        <td class="p-3"><span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">${user.planName}</span></td>
                        <td class="p-3">${new Date(user.planExpiry).toLocaleDateString()}</td>
                        <td class="p-3">
                            <button onclick="deleteUser('${user._id}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600">Delete</button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            }
        }

        async function updateSettings() {
            const qrCodeUrl = document.getElementById('qrInput').value;
            const promoBannerUrl = document.getElementById('promoInput').value;
            const plans = [
                { name: '1 Month Plan', price: '₹199', days: 30 },
                { name: '1 Year Plan', price: '₹999', days: 365 }
            ];

            const res = await fetch('/api/admin/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qrCodeUrl, promoBannerUrl, plans })
            });
            const data = await res.json();
            if(data.success) {
                alert("Settings & Promotion Banner updated successfully!");
                loadData();
            } else {
                alert("Error updating settings");
            }
        }

        async function deleteUser(id) {
            if (confirm("Kya aap waqai is user ko delete karna chahte hain?")) {
                const response = await fetch(`/api/admin/user/${id}`, { method: 'DELETE' });
                const data = await response.json();
                if (data.success) { loadData(); }
            }
        }

        loadData();
    </script>
</body>
</html>
